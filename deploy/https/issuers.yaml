apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: portfolio-letsencrypt-staging
spec:
  acme:
    email: annamalaikumar13@gmail.com
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: portfolio-letsencrypt-staging-account
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
            ingressTemplate:
              metadata:
                annotations:
                  traefik.ingress.kubernetes.io/router.entrypoints: web
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: portfolio-letsencrypt-production
spec:
  acme:
    email: annamalaikumar13@gmail.com
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: portfolio-letsencrypt-production-account
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
            ingressTemplate:
              metadata:
                annotations:
                  traefik.ingress.kubernetes.io/router.entrypoints: web
