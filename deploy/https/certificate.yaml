apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: portfolio-domain
  namespace: portfolio
spec:
  secretName: portfolio-domain-tls
  dnsNames: [annamalaidev.duckdns.org]
  renewBefore: 720h
  privateKey:
    rotationPolicy: Always
  issuerRef:
    name: portfolio-letsencrypt-production
    kind: ClusterIssuer
