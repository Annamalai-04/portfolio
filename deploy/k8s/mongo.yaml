apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: portfolio
spec:
  clusterIP: None
  selector: {app: mongo}
  ports: [{port: 27017, targetPort: 27017}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  namespace: portfolio
spec:
  serviceName: mongo
  replicas: 1
  selector:
    matchLabels: {app: mongo}
  template:
    metadata:
      labels: {app: mongo}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: mongo
          image: mongo:8.0
          ports: [{containerPort: 27017}]
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: portfolio
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: {name: database, key: password}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: '1', memory: 1Gi}
          volumeMounts: [{name: data, mountPath: /data/db}]
          readinessProbe:
            tcpSocket: {port: 27017}
            initialDelaySeconds: 10
          livenessProbe:
            tcpSocket: {port: 27017}
            initialDelaySeconds: 45
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 5Gi}
