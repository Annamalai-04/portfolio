apiVersion: v1
kind: Namespace
metadata:
  name: portfolio
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio
  namespace: portfolio
spec:
  replicas: 1
  selector:
    matchLabels: {app: portfolio}
  template:
    metadata:
      labels: {app: portfolio}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: app
          image: annamalaikumar/portfolio-3d@sha256:f7715c22520387ddd53374112403ebbde7b49e1abb3d32041c1373316d8cc004
          ports: [{containerPort: 3001}]
          env:
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef: {name: database, key: uri}
            - name: SITE_ORIGIN
              valueFrom:
                configMapKeyRef: {name: settings, key: site-origin}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: '1', memory: 512Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /api/health, port: 3001}
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: {path: /api/health, port: 3001}
            initialDelaySeconds: 25
---
apiVersion: v1
kind: Service
metadata:
  name: portfolio
  namespace: portfolio
spec:
  selector: {app: portfolio}
  ports: [{port: 80, targetPort: 3001}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio
  namespace: portfolio
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portfolio
                port: {number: 80}
